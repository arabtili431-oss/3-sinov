{% extends "base.html" %}
{% block title %}Kabinet — VECTOR{% endblock %}
{% block panel_class %}auth-panel--plain{% endblock %}

{% block panel %}
<div class="auth-card">
  <h2 class="auth-card__title">Xush kelibsiz! 🎉</h2>
  <p class="step-hint" id="hello">Ma’lumotlar yuklanmoqda...</p>
  <div class="alert" id="formAlert" role="alert"></div>
  <div class="form-actions">
    <button class="btn btn--ghost" type="button" id="logoutBtn">Chiqish</button>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
  var A = window.VectorAPI;
  var hello = document.getElementById("hello");

  A.request("/me/").then(function (user) {
    hello.innerHTML = "<b>" + user.full_name + "</b>, siz muvaffaqiyatli kirdingiz.<br>" +
      "Rol: " + user.role_display + (user.subject ? " (" + user.subject + ")" : "") + "<br>" +
      "Telefon: " + user.phone + "<br>" +
      (user.region ? "Hudud: " + user.region + ", " + user.district : "");
  }).catch(function () {
    window.location.href = "{% url 'frontend:login' %}";
  });

  document.getElementById("logoutBtn").addEventListener("click", function () {
    A.clearAll();
    window.location.href = "{% url 'frontend:login' %}";
  });
})();
</script>
{% endblock %}
